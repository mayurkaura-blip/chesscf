name = "chesscf"
pages_build_output_dir = "./dist"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "chesscf-db"
database_id = "ab8b3917-336b-488c-8cf4-678c420c4d44"

[[kv_namespaces]]
binding = "KV"
id = "fcead4081ec44a7299b31f8e5243163d"

[[r2_buckets]]
binding = "ASSETS_R2"
bucket_name = "chesscf-assets"

[[queues.producers]]
binding = "ANALYSIS_QUEUE"
queue = "chesscf-analysis"

[vars]
ENVIRONMENT = "production"
SITE_URL = "https://chess.mayurdemo.xyz"
